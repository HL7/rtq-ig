<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
<defs>
<marker id="mGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="mBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
<marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
<marker id="mPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="56" width="920" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
<text x="40" y="82" font-size="12" font-weight="700" fill="#64748b">TRANSPORT — any channel (out of scope)</text>
<text x="40" y="102" font-size="12" fill="#64748b">Email · Regulatory portal · eCTD sequence · Central platform · APIX Task (API) — the RTQ file travels unchanged over any of these</text>
<rect x="20" y="144" width="460" height="600" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="40" y="170" font-size="12" font-weight="700" fill="#2563eb">RTQ CORE (this guide)</text>
<rect x="60" y="186" width="380" height="150" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="250.0" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">RTQ Questionnaire</text>
<text x="250.0" y="230" text-anchor="middle" font-size="11.5" fill="#475569">Question set from the regulator</text>
<text x="250.0" y="247" text-anchor="middle" font-size="10.8" fill="#64748b">identifier · version · type · due dates</text>
<text x="250.0" y="264" text-anchor="middle" font-size="10.8" fill="#64748b">procedure number · product context</text>
<text x="250.0" y="281" text-anchor="middle" font-size="10.8" fill="#64748b">questions: CTD + category codes, required = true</text>
<rect x="60" y="446" width="380" height="150" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="250.0" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">RTQ QuestionnaireResponse</text>
<text x="250.0" y="490" text-anchor="middle" font-size="11.5" fill="#475569">Response set from the MAH/applicant</text>
<text x="250.0" y="507" text-anchor="middle" font-size="10.8" fill="#64748b">company + regulator identifiers · version · status</text>
<text x="250.0" y="524" text-anchor="middle" font-size="10.8" fill="#64748b">one answer item per question (linkId)</text>
<text x="250.0" y="541" text-anchor="middle" font-size="10.8" fill="#64748b">attachments and ePI references on answers</text>
<rect x="60" y="646" width="180" height="84" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
<text x="150.0" y="670" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">DocumentReference</text>
<text x="150.0" y="690" text-anchor="middle" font-size="10.8" fill="#64748b">attachments:</text>
<text x="150.0" y="707" text-anchor="middle" font-size="10.8" fill="#64748b">embed ≤ ~10 MB, else url</text>
<rect x="260" y="646" width="180" height="84" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="2" stroke-dasharray="6 3"/>
<text x="350.0" y="670" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Task / Flag</text>
<text x="350.0" y="690" text-anchor="middle" font-size="10.8" fill="#64748b">commitment tracking</text>
<text x="350.0" y="707" text-anchor="middle" font-size="10.8" fill="#64748b">(usage pattern)</text>
<rect x="560" y="144" width="380" height="600" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
<text x="580" y="170" font-size="12" font-weight="700" fill="#16a34a">REGULATORY CONTEXT (R5 ecosystem)</text>
<rect x="600" y="196" width="300" height="76" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="750.0" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">MedicinalProductDefinition</text>
<text x="750.0" y="240" text-anchor="middle" font-size="10.8" fill="#64748b">the product the questions concern</text>
<rect x="600" y="306" width="300" height="76" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="750.0" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">RegulatedAuthorization</text>
<text x="750.0" y="350" text-anchor="middle" font-size="10.8" fill="#64748b">the marketing authorisation / registration</text>
<rect x="600" y="416" width="300" height="76" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="750.0" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Regulatory procedure</text>
<text x="750.0" y="460" text-anchor="middle" font-size="10.8" fill="#64748b">identifier only — no FHIR resource needed</text>
<rect x="600" y="526" width="300" height="76" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="750.0" y="550" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">ePI Bundle / Composition</text>
<text x="750.0" y="570" text-anchor="middle" font-size="10.8" fill="#64748b">structured product information content</text>
<path d="M 160 446 L 160 336" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#mBlue)"/>
<path d="M 340 336 L 340 446" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#mPurple)"/>
<path d="M 150 596 L 150 646" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#mGreen)"/>
<path d="M 350 596 L 350 646" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#mAmber)"/>
<path d="M 440 234 L 600 234" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#mGrey)"/>
<path d="M 440 264 L 520 264 L 520 344 L 600 344" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#mGrey)"/>
<path d="M 440 294 L 472 294 L 472 454 L 600 454" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#mGrey)"/>
<path d="M 440 564 L 600 564" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#mGrey)"/>
<text x="480.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">RTQ Resource Relationships</text>
<rect x="74.875" y="374.0" width="170.25" height="34" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<text x="160" y="388" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2563eb">questionnaire (canonical)</text>
<text x="160" y="402" text-anchor="middle" font-size="10.5" fill="#2563eb">answers matched by linkId</text>
<rect x="276.19" y="374.0" width="127.61999999999999" height="34" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
<text x="340" y="388" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7c3aed">rtq-in-response-to</text>
<text x="340" y="402" text-anchor="middle" font-size="10.5" fill="#7c3aed">follow-up rounds</text>
<rect x="489.685" y="208.0" width="60.629999999999995" height="20" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
<text x="520" y="221.8" text-anchor="middle" font-size="10.5" font-weight="600" fill="#64748b">product</text>
<rect x="471.415" y="300.0" width="97.16999999999999" height="20" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
<text x="520" y="313.8" text-anchor="middle" font-size="10.5" font-weight="600" fill="#64748b">authorisation</text>
<rect x="414.28" y="400.0" width="115.44" height="20" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
<text x="472" y="413.8" text-anchor="middle" font-size="10.5" font-weight="600" fill="#64748b">procedure number</text>
<rect x="468.37" y="538.0" width="103.25999999999999" height="20" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
<text x="520" y="551.8" text-anchor="middle" font-size="10.5" font-weight="600" fill="#64748b">ePI references</text>
<rect x="20" y="768" width="920" height="90" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<text x="38" y="790" font-size="12" font-weight="700" fill="#0f172a">Reading the diagram</text>
<line x1="38" y1="806" x2="78" y2="806" stroke="#2563eb" stroke-width="2.2"/>
<text x="88" y="810" font-size="11.5" fill="#475569">Solid blue — canonical link from response to question set; answers matched by linkId.</text>
<line x1="38" y1="826" x2="78" y2="826" stroke="#64748b" stroke-width="2.2" stroke-dasharray="4 3"/>
<text x="88" y="830" font-size="11.5" fill="#475569">Dashed grey — optional context links (extensions on both Questionnaire and QuestionnaireResponse).</text>
<line x1="38" y1="846" x2="78" y2="846" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="88" y="850" font-size="11.5" fill="#475569">Dashed purple — multi-round thread: follow-up question set references the prior response.</text>
</svg>
