<style>
/* RTQ shared page components. Included at the top of each page with {% include rtq-style.html %}. */
:root{--rtq-navy:#003087;--rtq-blue:#2563eb;--rtq-violet:#7c3aed;--rtq-green:#16a34a;--rtq-ink:#111827;--rtq-muted:#6b7280;--rtq-line:#e5e7eb;--rtq-soft:#f9fafb;}
.rtq-hero{text-align:center;padding:40px 20px 24px;}
.rtq-eyebrow{font-size:.75em;font-weight:700;text-transform:uppercase;letter-spacing:.22em;color:var(--rtq-navy);margin-bottom:16px;}
.rtq-h1{font-size:2.4em;font-weight:800;line-height:1.15;margin:0 0 16px;color:var(--rtq-ink);}
.rtq-grad{background:linear-gradient(135deg,#003087,#7c3aed);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.rtq-lead{font-size:1.02em;color:#4b5563;max-width:700px;margin:0 auto 24px;line-height:1.6;}
.rtq-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
a.rtq-btn{display:inline-block;background:var(--rtq-navy);color:#fff;padding:12px 24px;border-radius:8px;font-weight:700;text-decoration:none;}
a.rtq-btn.alt{background:var(--rtq-violet);}
a.rtq-btn.ghost{background:#fff;color:var(--rtq-navy);border:1.5px solid var(--rtq-navy);}
.rtq-figure{text-align:center;padding:8px 20px 32px;}
.rtq-figure img{max-width:100%;border:1px solid var(--rtq-line);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.06);background:#fff;}
.rtq-figure .cap{font-size:.82em;color:var(--rtq-muted);margin-top:8px;font-style:italic;}
.rtq-sec{font-size:1.3em;font-weight:700;color:var(--rtq-ink);margin:36px 0 12px;}
.rtq-sec-c{text-align:center;margin:40px 0 24px;}
.rtq-sec-c .rtq-sec{font-size:1.5em;font-weight:800;margin:0 0 8px;}
.rtq-sec-c p{color:var(--rtq-muted);max-width:560px;margin:0 auto;}
.rtq-hr{border:none;border-top:1px solid var(--rtq-line);margin:32px 0;}
.rtq-grid{display:grid;gap:14px;margin:0 0 20px;}
.rtq-g2{grid-template-columns:repeat(2,1fr);} .rtq-g3{grid-template-columns:repeat(3,1fr);} .rtq-g4{grid-template-columns:repeat(4,1fr);}
.rtq-card{background:#fff;border:1px solid var(--rtq-line);border-radius:10px;padding:20px;display:flex;flex-direction:column;}
.rtq-card.soft{background:var(--rtq-soft);}
.rtq-card .ic{font-size:1.4em;margin-bottom:8px;}
.rtq-card .t{font-weight:700;color:var(--rtq-navy);margin-bottom:6px;}
.rtq-card p{font-size:.88em;margin:0 0 10px;flex:1;}
.rtq-card ul{font-size:.88em;margin:0;padding-left:18px;}
.rtq-card .tag{font-size:.72em;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--rtq-muted);}
.rtq-card a.more{font-weight:600;font-size:.85em;text-decoration:none;}
.rtq-in{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;padding:16px;color:#064e3b;}
.rtq-out{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:16px;color:#7f1d1d;}
.rtq-in .h,.rtq-out .h{font-weight:700;margin-bottom:6px;}
.rtq-in ul,.rtq-out ul{font-size:.88em;margin:0;padding-left:18px;}
.rtq-in li,.rtq-out li{margin-bottom:6px;}
.rtq-stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rtq-line);border-radius:10px;overflow:hidden;margin-bottom:16px;}
.rtq-stats div{padding:18px 12px;text-align:center;background:#fafbff;border-right:1px solid var(--rtq-line);}
.rtq-stats div:last-child{border-right:none;}
.rtq-stats b{display:block;font-size:1.45em;font-weight:800;color:var(--rtq-navy);}
.rtq-stats span{font-size:.8em;color:var(--rtq-muted);}
.rtq-steps{display:flex;align-items:flex-start;justify-content:center;margin:0 0 28px;}
.rtq-step{text-align:center;flex:1;max-width:170px;padding:0 4px;}
.rtq-step .c{width:56px;height:56px;border-radius:50%;border:3px solid var(--rtq-blue);background:#eff6ff;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:1.3em;}
.rtq-step .n{font-size:.7em;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--rtq-blue);}
.rtq-step .t{font-weight:700;color:var(--rtq-ink);font-size:.95em;margin:2px 0 4px;}
.rtq-step p{font-size:.8em;color:var(--rtq-muted);line-height:1.45;margin:0;}
.rtq-step.co .c{border-color:var(--rtq-green);background:#f0fdf4;} .rtq-step.co .n{color:var(--rtq-green);}
.rtq-step.done .c{border-color:var(--rtq-violet);background:#f5f3ff;} .rtq-step.done .n{color:var(--rtq-violet);}
.rtq-arrow{padding-top:18px;color:#cbd5e1;font-size:1.2em;flex:none;}
.rtq-loop{text-align:center;font-size:.85em;color:var(--rtq-muted);margin:-14px 0 24px;}
.rtq-callout{display:flex;gap:14px;align-items:flex-start;border-radius:12px;padding:16px 18px;margin:16px 0 24px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;}
.rtq-callout .ic{font-size:1.4em;line-height:1;}
.rtq-callout .h{font-weight:700;margin-bottom:4px;}
.rtq-callout p{margin:0 0 6px;} .rtq-callout p:last-child{margin:0;}
.rtq-callout.violet{background:#f5f3ff;border-color:#ddd6fe;color:#3b0764;}
.rtq-callout.green{background:#f0fdf4;border-color:#bbf7d0;color:#14532d;}
.rtq-callout.amber{background:#fffbeb;border-color:#fde68a;color:#78350f;}
.rtq-table{width:100%;border-collapse:collapse;margin:8px 0 20px;font-size:.9em;}
.rtq-table th{background:#f3f4f6;text-align:left;padding:9px 10px;border-bottom:2px solid #d1d5db;color:var(--rtq-ink);}
.rtq-table td{padding:9px 10px;border-bottom:1px solid var(--rtq-line);vertical-align:top;}
.rtq-table tr.grp td{background:var(--rtq-soft);font-weight:700;color:var(--rtq-navy);font-size:.82em;text-transform:uppercase;letter-spacing:.05em;}
.rtq-ba{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--rtq-line);border-radius:12px;overflow:hidden;margin:0 0 6px;}
.rtq-ba > div{padding:14px 16px;font-size:.88em;}
.rtq-ba .before{background:#fef2f2;color:#7f1d1d;} .rtq-ba .after{background:#ecfdf5;color:#064e3b;}
.rtq-ba .h{font-weight:700;margin-bottom:4px;}
.rtq-scn{margin:0 0 22px;}
.rtq-scn .t{font-weight:700;color:var(--rtq-ink);font-size:1.05em;margin-bottom:2px;}
.rtq-scn .ctx{font-size:.88em;color:var(--rtq-muted);margin-bottom:8px;}
.rtq-pill{display:inline-block;font-size:.8em;font-weight:700;padding:3px 10px;border-radius:999px;background:#ede9fe;color:#5b21b6;margin-top:6px;}
.rtq-badge{display:inline-block;font-size:.75em;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;}
.rtq-badge.res{background:#dcfce7;color:#166534;} .rtq-badge.nr{background:#fee2e2;color:#b91c1c;} .rtq-badge.fq{background:#fef3c7;color:#92400e;}
.rtq-chip{display:inline-block;font-family:monospace;font-size:.72em;font-weight:700;padding:2px 7px;border-radius:4px;background:#eff6ff;color:var(--rtq-blue);margin-right:4px;}
.rtq-chip.cat{background:#fef2f2;color:#b91c1c;}
.rtq-check{list-style:none;padding:0;margin:0;}
.rtq-check li{padding:6px 0 6px 28px;position:relative;border-bottom:1px dashed var(--rtq-line);font-size:.92em;}
.rtq-check li:last-child{border-bottom:none;}
.rtq-check li:before{content:"✓";position:absolute;left:4px;top:5px;color:var(--rtq-green);font-weight:800;}
.rtq-anno{display:flex;gap:40px;align-items:flex-start;margin:28px 0;flex-wrap:wrap;}
.rtq-doc{flex:1;min-width:300px;max-width:520px;background:#fff;border:1px solid var(--rtq-line);border-radius:14px;padding:22px;box-shadow:0 4px 16px rgba(0,0,0,.07);font-size:.88em;}
.rtq-part{border:2px solid;border-radius:8px;padding:10px 14px;margin-bottom:12px;}
.rtq-part:last-child{margin-bottom:0;}
.rtq-part .k{font-size:.72em;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.rtq-part.a{background:#eff6ff;border-color:#2563eb;} .rtq-part.a .k{color:#2563eb;}
.rtq-part.b{background:#f0fdf4;border-color:#16a34a;} .rtq-part.b .k{color:#16a34a;}
.rtq-part.c{background:#fefce8;border-color:#ca8a04;} .rtq-part.c .k{color:#ca8a04;}
.rtq-part.d{background:#fdf4ff;border-color:#9333ea;} .rtq-part.d .k{color:#9333ea;}
.rtq-part.e{background:#fff7ed;border-color:#ea580c;} .rtq-part.e .k{color:#ea580c;}
.rtq-mini{background:#fff;border:1px solid var(--rtq-line);border-radius:6px;padding:8px 10px;margin-top:6px;}
.rtq-mini .top{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
.rtq-mini .q{font-weight:600;}
.rtq-mini .s{color:var(--rtq-muted);font-size:.9em;}
.rtq-labels{flex:1;min-width:260px;display:flex;flex-direction:column;gap:16px;padding-top:6px;}
.rtq-lab{display:flex;gap:12px;align-items:flex-start;}
.rtq-lab .dot{width:28px;height:28px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85em;flex:none;margin-top:2px;}
.rtq-lab .h{font-weight:700;color:var(--rtq-ink);margin-bottom:2px;}
.rtq-lab p{font-size:.88em;margin:0;}
.rtq-two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 20px;}
@media (max-width:820px){
  .rtq-g3,.rtq-g4,.rtq-stats{grid-template-columns:repeat(2,1fr);}
  .rtq-g2,.rtq-ba,.rtq-two{grid-template-columns:1fr;}
  .rtq-steps{flex-wrap:wrap;gap:12px;} .rtq-arrow{display:none;} .rtq-step{flex:1 1 40%;}
  .rtq-h1{font-size:1.9em;}
}
@media (max-width:520px){ .rtq-g3,.rtq-g4,.rtq-stats{grid-template-columns:1fr;} }
</style>
